<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Halaman Tidak Ditemukan — CV Armada Advertising</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0d0b0c" />
  <link rel="icon" href="assets/img/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    .nf { min-height: 100svh; display: grid; place-items: center; text-align: center; padding: 40px 16px; background: radial-gradient(50% 40% at 50% 40%, rgba(245, 228, 0, 0.1), transparent 70%), var(--ink); }
    .nf-code { font-size: clamp(6rem, 28vw, 14rem); font-weight: 900; line-height: 0.9; letter-spacing: -0.06em; color: #fff9b8; text-shadow: 0 0 6px #fff59a, 0 0 22px var(--yellow), 0 0 60px rgba(245, 228, 0, 0.6); animation: nfFlicker 4s infinite; }
    .nf-code span { color: var(--red-2); text-shadow: 0 0 10px rgba(255, 40, 40, 0.8), 0 0 40px rgba(255, 30, 30, 0.5); animation: nfOff 4s infinite; }
    .nf h1 { font-size: clamp(1.4rem, 4vw, 2rem); font-weight: 900; letter-spacing: -0.02em; margin: 18px 0 10px; }
    .nf p { color: var(--muted); margin-bottom: 28px; }
    .nf-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    @keyframes nfFlicker { 0%, 92%, 100% { opacity: 1; } 93%, 95% { opacity: 0.35; } 94%, 96% { opacity: 1; } }
    @keyframes nfOff { 0%, 40%, 100% { opacity: 1; } 41%, 43%, 46% { opacity: 0.15; } 42%, 44% { opacity: 0.9; } }
  </style>
</head>
<body>
  <main class="nf">
    <div>
      <div class="nf-code" aria-hidden="true">4<span>0</span>4</div>
      <h1>Lampunya padam di sini.</h1>
      <p>Halaman yang kamu cari tidak ditemukan.</p>
      <div class="nf-actions">
        <a class="btn btn-yellow" href="./">Kembali ke Beranda</a>
        <a class="btn btn-ghost" href="./#produk">Lihat Produk</a>
      </div>
    </div>
  </main>
</body>
</html>
